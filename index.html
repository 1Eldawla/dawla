<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطالب - Eldawla</title>
    <style>
        /* رجعتلك الستايل القديم بتاعك بالظبط */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #2c2c2c; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); width: 350px; text-align: center; }
        h2 { color: #4CAF50; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; background: #3d3d3d; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background-color: #4CAF50; color: white; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #45a049; }
        .switch-btn { color: #bbb; cursor: pointer; font-size: 14px; margin-top: 15px; display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: white; }
        th, td { border: 1px solid #444; padding: 10px; }
        th { background-color: #4CAF50; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginPage">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="studentCode" placeholder="كود الطالب"> <input type="password" id="studentPass" placeholder="كلمة السر">
        <button onclick="login()">دخول</button>
        <span class="switch-btn" onclick="showRegister()">إنشاء حساب جديد</span>
    </div>

    <div id="registerPage" style="display:none;">
        <h2>إنشاء حساب</h2>
        <input type="text" id="regCode" placeholder="كود الطالب"> <input type="password" id="regPass" placeholder="اختر كلمة سر">
        <button onclick="register()">تسجيل</button>
        <span class="switch-btn" onclick="showLogin()">العودة لتسجيل الدخول</span>
    </div>

    <div id="dataPage" style="display:none;">
        <h3 id="welcomeMsg"></h3>
        <table>
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>الدرجة</th>
                </tr>
            </thead>
            <tbody id="gradesTable"></tbody>
        </table>
        <button onclick="location.reload()" style="margin-top:20px; background:#f44336;">خروج</button>
    </div>
</div>

<script>
    function showRegister() { document.getElementById('loginPage').style.display='none'; document.getElementById('registerPage').style.display='block'; }
    function showLogin() { document.getElementById('loginPage').style.display='block'; document.getElementById('registerPage').style.display='none'; }

    function register() {
        const code = document.getElementById('regCode').value;
        const pass = document.getElementById('regPass').value;
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let student = students.find(s => s.code === code);
        if (student) {
            student.password = pass;
            localStorage.setItem('students', JSON.stringify(students));
            alert("تم إنشاء الحساب!");
            showLogin();
        } else {
            alert("الكود غير موجود بالسجل!");
        }
    }

    function login() {
        const code = document.getElementById('studentCode').value;
        const pass = document.getElementById('studentPass').value;
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let student = students.find(s => s.code === code && s.password === pass);
        if (student) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dataPage').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = "أهلاً " + student.name;
            let rows = "";
            student.grades.forEach(g => { rows += `<tr><td>${g.subject}</td><td>${g.grade}</td></tr>`; });
            document.getElementById('gradesTable').innerHTML = rows;
        } else {
            alert("خطأ في الكود أو كلمة السر!");
        }
    }
</script>
</body>
</html>
