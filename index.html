<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Eldawla | دخول الطالب</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #161b22; --text: #e6edf3; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 25px; border-radius: 12px; width: 95%; max-width: 650px; text-align: center; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .welcome-box { background-color: #1c2128; border: 1px solid var(--primary); padding: 15px; border-radius: 10px; margin-bottom: 20px; color: var(--accent); font-size: 1.2rem; font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #30363d; border-radius: 8px; background: #0d1117; color: white; box-sizing: border-box; text-align: center; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background-color: var(--primary); color: white; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: scale(0.98); }
        table { width: 100%; border-collapse: collapse; background-color: #0d1117; border-radius: 10px; overflow: hidden; margin-top: 15px; border: 1px solid #30363d; }
        th { background-color: var(--primary); color: white; padding: 12px; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #30363d; font-size: 14px; color: #e6edf3; }
        .pay-ok { color: #4caf50; font-weight: bold; }
        .pay-no { color: #f44336; font-weight: bold; }
        .logout-btn { background-color: #30363d; color: white; margin-top: 20px; width: auto; padding: 10px 25px; border-radius: 8px; cursor: pointer; border: none; }
        .switch-link { color: var(--accent); cursor: pointer; display: block; margin-top: 15px; text-decoration: underline; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginPage">
        <h2 style="color: var(--accent);">تسجيل دخول الطالب 🎓</h2>
        <input type="text" id="studentCode" placeholder="كود الطالب"> 
        <input type="password" id="studentPass" placeholder="كلمة السر">
        <button onclick="login()">دخول للملف الشخصي</button>
        <span class="switch-link" onclick="showRegister()">ليس لديك كلمة سر؟ (تفعيل الحساب)</span>
    </div>

    <div id="registerPage" style="display:none;">
        <h2 style="color: var(--accent);">تفعيل حساب جديد 📝</h2>
        <p style="font-size: 0.8rem; color: #888;">ادخل الكود الذي استلمته من المستر واختر كلمة سر</p>
        <input type="text" id="regCode" placeholder="كود الطالب">
        <input type="password" id="regPass" placeholder="اختر كلمة سر جديدة">
        <button onclick="register()" style="background-color: #238636;">تفعيل الحساب الآن</button>
        <span class="switch-link" onclick="showLogin()">العودة للدخول</span>
    </div>

    <div id="dataPage" style="display:none;">
        <div class="welcome-box" id="welcomeMsg"></div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الامتحان/الحصة</th>
                        <th>الدرجة</th>
                        <th>المبلغ</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="gradesTable"></tbody>
            </table>
        </div>
        <button class="logout-btn" onclick="location.reload()">تسجيل خروج</button>
    </div>
</div>

<script>
    // التنقل بين الصفحات
    function showRegister() { 
        document.getElementById('loginPage').style.display='none'; 
        document.getElementById('registerPage').style.display='block'; 
    }
    function showLogin() { 
        document.getElementById('loginPage').style.display='block'; 
        document.getElementById('registerPage').style.display='none'; 
    }

    // وظيفة تسجيل الدخول
    function login() {
        const id = document.getElementById('studentCode').value.trim();
        const pass = document.getElementById('studentPass').value.trim();

        // دخول الأدمن السريع
        if (id === "Dawla" && pass === "123400") {
            window.location.href = "admin.html";
            return;
        }

        let students = JSON.parse(localStorage.getItem('students')) || {};
        let student = students[id];
        
        if (student) {
            if (student.password === "") {
                alert("حسابك موجود ولكن غير مفعل. من فضلك اضغط على 'تفعيل الحساب' واختر كلمة سر.");
                return;
            }

            if (student.password === pass) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('dataPage').style.display = 'block';
                document.getElementById('welcomeMsg').innerText = "أهلاً بك يا " + student.name;
                
                let rows = "";
                let history = student.history || [];
                
                if(history.length === 0) {
                    rows = "<tr><td colspan='5'>لا توجد حصص مسجلة لك حتى الآن</td></tr>";
                } else {
                    // عرض من الأحدث للأقدم
                    [...history].reverse().forEach(h => {
                        let statusIcon = h.paid === "✅" ? "✅" : "❌";
                        let payClass = h.paid === "✅" ? "pay-ok" : "pay-no";
                        
                        rows += `<tr>
                            <td>${h.date}</td>
                            <td>${h.exam || "حصة"}</td>
                            <td style="color:var(--accent); font-weight:bold;">${h.grade}</td>
                            <td>${h.pay} ج.م</td>
                            <td class="${payClass}">${statusIcon}</td>
                        </tr>`;
                    });
                }
                document.getElementById('gradesTable').innerHTML = rows;
            } else {
                alert("كلمة السر غير صحيحة!");
            }
        } else {
            alert("هذا الكود غير مسجل. تأكد من الكود أو راجع المستر.");
        }
    }

    // وظيفة تفعيل الحساب
    function register() {
        const id = document.getElementById('regCode').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        
        if(!id || !pass) {
            alert("برجاء إدخال الكود وكلمة السر");
            return;
        }

        let students = JSON.parse(localStorage.getItem('students')) || {};

        if (students[id]) {
            students[id].password = pass; // حفظ كلمة السر للطالب
            localStorage.setItem('students', JSON.stringify(students));
            alert("تم تفعيل حسابك بنجاح! يمكنك الآن تسجيل الدخول.");
            showLogin();
        } else {
            alert("عذراً، هذا الكود غير موجود في سجلات المستر. تأكد من كتابة الكود صح.");
        }
    }
</script>

</body>
</html>
