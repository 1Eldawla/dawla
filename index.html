<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطالب - Eldawla</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; min-width: 300px; }
        input { display: block; width: 90%; margin: 10px auto; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginPage">
        <h2>تسجيل دخول الطالب</h2>
        <input type="text" id="studentCode" placeholder="كود الطالب">
        <input type="password" id="studentPass" placeholder="كلمة السر">
        <button onclick="login()">دخول</button>
        <p id="loginError" class="error"></p>
        <p>ليس لديك حساب؟ <span onclick="showRegister()" style="color:blue; cursor:pointer;">إنشاء حساب جديد</span></p>
    </div>

    <div id="registerPage" style="display:none;">
        <h2>إنشاء حساب جديد</h2>
        <input type="text" id="regCode" placeholder="كود الطالب">
        <input type="password" id="regPass" placeholder="اختر كلمة سر">
        <button onclick="register()">تسجيل</button>
        <p id="regError" class="error"></p>
        <p onclick="showLogin()" style="color:blue; cursor:pointer;">العودة لتسجيل الدخول</p>
    </div>

    <div id="dataPage" style="display:none;">
        <h2 id="welcomeMsg"></h2>
        <table>
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>الدرجة</th>
                </tr>
            </thead>
            <tbody id="gradesTable"></tbody>
        </table>
        <br>
        <button onclick="logout()" style="background:#dc3545;">تسجيل خروج</button>
    </div>
</div>

<script>
    function showRegister() { document.getElementById('loginPage').style.display='none'; document.getElementById('registerPage').style.display='block'; }
    function showLogin() { document.getElementById('loginPage').style.display='block'; document.getElementById('registerPage').style.display='none'; }

    function register() {
        const code = document.getElementById('regCode').value;
        const pass = document.getElementById('regPass').value;
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let student = students.find(s => s.code === code);

        if (student) {
            student.password = pass; // حفظ الباسورد للكود الموجود
            localStorage.setItem('students', JSON.stringify(students));
            alert("تم إنشاء الحساب بنجاح!");
            showLogin();
        } else {
            document.getElementById('regError').innerText = "هذا الكود غير مسجل في النظام!";
        }
    }

    function login() {
        const code = document.getElementById('studentCode').value;
        const pass = document.getElementById('studentPass').value;
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let student = students.find(s => s.code === code && s.password === pass);

        if (student) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dataPage').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = "أهلاً بك يا " + student.name;
            let tableContent = "";
            student.grades.forEach(g => {
                tableContent += `<tr><td>${g.subject}</td><td>${g.grade}</td></tr>`;
            });
            document.getElementById('gradesTable').innerHTML = tableContent;
        } else {
            document.getElementById('loginError').innerText = "الكود أو كلمة السر خطأ!";
        }
    }

    function logout() { location.reload(); }
</script>

</body>
</html>
