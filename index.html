<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Eldawla | دخول الطالب</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #161b22; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 25px; border-radius: 15px; width: 95%; max-width: 500px; text-align: center; border: 1px solid #30363d; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #30363d; border-radius: 10px; background: #0d1117; color: white; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; background-color: #238636; color: white; cursor: pointer; font-weight: bold; }
        .switch-link { color: #58a6ff; cursor: pointer; display: block; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container" id="mainBox">
    <h2 style="color: var(--accent);">تسجيل دخول 🎓</h2>
    <input type="text" id="studentCode" placeholder="كود الطالب"> 
    <input type="password" id="studentPass" placeholder="كلمة السر">
    <button onclick="login()">دخول</button>
</div>

<script>
    function login() {
        const id = document.getElementById('studentCode').value.trim();
        const pass = document.getElementById('studentPass').value.trim();

        // دخول الأدمن (Dawla / 123400)
        if (id === "Dawla" && pass === "123400") {
            localStorage.setItem('adminKey', 'Verified_' + Date.now()); // استخدام مفتاح أقوى
            window.location.replace("admin.html"); // استبدال الصفحة لضمان عدم العودة
            return;
        }

        let students = JSON.parse(localStorage.getItem('students')) || {};
        if (students[id] && students[id].password === pass) {
            localStorage.setItem('loggedStudentId', id);
            // هنا ممكن تفتح صفحة بيانات الطالب بنفس الطريقة
            alert("أهلاً بك يا " + students[id].name);
        } else {
            alert("خطأ في البيانات!");
        }
    }
</script>
</body>
</html>
