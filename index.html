<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة الدولا النهائية</title>
    <style>
        body { font-family: sans-serif; background: #0b0e14; color: white; text-align: center; padding: 50px; }
        .box { background: #161b22; padding: 30px; border-radius: 15px; display: inline-block; border: 1px solid #30363d; }
        input { display: block; width: 250px; padding: 10px; margin: 10px auto; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #238636; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loginBox" class="box">
        <h2>تسجيل دخول 🎓</h2>
        <input type="text" id="u" placeholder="الكود">
        <input type="password" id="p" placeholder="الباسورد">
        <button onclick="go()">دخول</button>
    </div>

    <div id="adminBox" class="box hidden">
        <h2 style="color: #00d2ff;">لوحة التحكم (مستر الدولا)</h2>
        <input type="text" id="sId" placeholder="كود الطالب">
        <input type="text" id="sName" placeholder="اسمه">
        <input type="text" id="sExam" placeholder="الامتحان">
        <select id="sLevel">
            <option>ممتاز ⭐⭐⭐</option>
            <option>جيد جداً ⭐⭐</option>
            <option>جيد ⭐</option>
            <option>ضعيف ⚠️</option>
        </select>
        <button onclick="add()">إضافة بيانات</button>
        <button onclick="location.reload()" style="background: red;">خروج</button>
        <div id="list" style="margin-top: 20px; text-align: right;"></div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('my_students')) || {};

        function go() {
            let u = document.getElementById('u').value;
            let p = document.getElementById('p').value;
            
            if(u === "Dawla" && p === "123400") {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminBox').classList.remove('hidden');
                show();
            } else {
                alert("بيانات غلط!");
            }
        }

        function add() {
            let id = document.getElementById('sId').value;
            let name = document.getElementById('sName').value;
            if(!data[id]) data[id] = { name: name, history: [] };
            data[id].history.push({
                date: new Date().toLocaleDateString('ar-EG'),
                exam: document.getElementById('sExam').value,
                level: document.getElementById('sLevel').value
            });
            localStorage.setItem('my_students', JSON.stringify(data));
            alert("تم الحفظ!");
            show();
        }

        function show() {
            let list = document.getElementById('list');
            list.innerHTML = "";
            for(let id in data) {
                list.innerHTML += `<p>✅ ${data[id].name} (${id}) - آخر مستوى: ${data[id].history.slice(-1)[0].level}</p>`;
            }
        }
    </script>
</body>
</html>
