<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Eldawla | بوابة الطالب</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #161b22; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: var(--card); padding: 25px; border-radius: 15px; width: 95%; max-width: 700px; text-align: center; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .welcome-box { background: linear-gradient(135deg, #1c2128, #2d1b69); border: 1px solid var(--primary); padding: 20px; border-radius: 12px; margin-bottom: 20px; color: var(--accent); font-size: 1.3rem; font-weight: bold; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #30363d; border-radius: 10px; background: #0d1117; color: white; box-sizing: border-box; text-align: center; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 10px rgba(124, 58, 237, 0.3); }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; background-color: #238636; color: white; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #2ea043; transform: translateY(-2px); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border-radius: 10px; overflow: hidden; }
        th { background-color: var(--primary); color: white; padding: 12px; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #30363d; font-size: 14px; background-color: #0d1117; color: #e6edf3; }
        .pay-ok { color: #4caf50; font-weight: bold; }
        .pay-no { color: #f44336; font-weight: bold; }
        .logout-btn { background-color: #30363d; color: white; margin-top: 25px; width: auto; padding: 10px 30px; border-radius: 8px; cursor: pointer; }
        .switch-link { color: #58a6ff; cursor: pointer; display: block; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <div id="loginPage">
        <h2 style="color: var(--accent);">تسجيل دخول الطالب 🎓</h2>
        <input type="text" id="studentCode" placeholder="كود الطالب"> 
        <input type="password" id="studentPass" placeholder="كلمة السر">
        <button onclick="login()">دخول للملف الشخصي</button>
        <span class="switch-link" onclick="showRegister()">ليس لديك كلمة سر؟ تفعيل الحساب</span>
    </div>

    <div id="registerPage" style="display:none;">
        <h2 style="color: var(--accent);">تفعيل الحساب لأول مرة 📝</h2>
        <p style="font-size: 0.8rem; color: #8b949e;">أدخل الكود الذي استلمته من المستر لإنشاء كلمة سر</p>
        <input type="text" id="regCode" placeholder="كود الطالب">
        <input type="password" id="regPass" placeholder="اختر كلمة سر جديدة">
        <button onclick="register()" style="background-color: var(--primary);">تفعيل الحساب الآن</button>
        <span class="switch-link" onclick="showLogin()">العودة لتسجيل الدخول</span>
    </div>

    <div id="dataPage" style="display:none;">
        <div class="welcome-box" id="welcomeMsg"></div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الامتحان/الحصة</th>
                        <th>الدرجة</th>
                        <th>المبلغ</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="gradesTable"></tbody>
            </table>
        </div>
        <button class="logout-btn" onclick="location.reload()">تسجيل خروج</button>
    </div>
</div>

<script>
    function showRegister() { document.getElementById('loginPage').style.display='none'; document.getElementById('registerPage').style.display='block'; }
    function showLogin() { document.getElementById('loginPage').style.display='block'; document.getElementById('registerPage').style.display='none'; }

    function login() {
        const id = document.getElementById('studentCode').value.trim();
        const pass = document.getElementById('studentPass').value.trim();

        // دخول الأدمن السريع
        if (id === "Dawla" && pass === "123400") {
            window.location.href = "admin.html";
            return;
        }

        let students = JSON.parse(localStorage.getItem('students')) || {};
        let student = students[id];
        
        if (student && student.password === pass) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dataPage').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = "أهلاً بك يا " + student.name;
            
            let rows = "";
            let history = student.history || [];
            
            if(history.length === 0) {
                rows = "<tr><td colspan='5'>لا توجد بيانات مسجلة لك حتى الآن</td></tr>";
            } else {
                // عرض السجلات من الأحدث للأقدم
                [...history].reverse().forEach(h => {
                    let payStatusClass = h.paidStatus === "✅" ? "pay-ok" : "pay-no";
                    rows += `<tr>
                        <td>${h.date}</td>
                        <td style="color:var(--accent)">${h.examName || "حصة"}</td>
                        <td style="font-weight:bold;">${h.grade}</td>
                        <td class="${payStatusClass}">${h.pay} ج.م</td>
                        <td>${h.paidStatus}</td>
                    </tr>`;
                });
            }
            document.getElementById('gradesTable').innerHTML = rows;
        } else { 
            alert("الكود أو كلمة السر خطأ، أو ربما لم تقم بتفعيل حسابك بعد!"); 
        }
    }

    function register() {
        const id = document.getElementById('regCode').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        
        if(!id || !pass) return alert("برجاء ملء جميع الخانات!");

        let students = JSON.parse(localStorage.getItem('students')) || {};

        // لازم المستر يكون ضاف الطالب الأول في صفحة الـ Admin
        if (students[id]) {
            students[id].password = pass;
            localStorage.setItem('students', JSON.stringify(students));
            alert("تم تفعيل حسابك بنجاح! يمكنك الآن تسجيل الدخول.");
            showLogin();
        } else { 
            alert("عذراً، هذا الكود غير موجود! تأكد أن المستر قد قام بإضافتك أولاً."); 
        }
    }
</script>
</body>
</html>
