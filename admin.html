<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم مستر الدولا | برمجة عمرو جابر</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #161b22; --text: #e6edf3; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; min-height: 100vh; padding-bottom: 100px; }
        .container { max-width: 1100px; margin: auto; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 30px; border: 1px solid #30363d; }
        
        .class-manager { background: #1c2128; padding: 20px; border-radius: 15px; border: 1px dashed var(--accent); margin-bottom: 30px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .class-manager input { width: 250px; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; }
        .btn-create { background: var(--accent); color: #000; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { padding: 12px 25px; background: var(--card); border: 1px solid #30363d; color: white; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); border-color: var(--accent); box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }

        .input-card { background: var(--card); padding: 25px; border-radius: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; border: 1px solid var(--primary); }
        .input-card h3 { grid-column: 1/-1; margin: 0 0 10px; color: var(--accent); text-align: center; }
        input, select { padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; }
        
        .btn-add { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; grid-column: 1 / -1; font-size: 16px; transition: 0.3s; }
        .btn-add:hover { opacity: 0.9; transform: scale(0.99); }

        /* ستايل الكراسة / الفولدر */
        .student-folder { background: var(--card); border-radius: 15px; margin-bottom: 15px; border: 1px solid #30363d; overflow: hidden; border-right: 5px solid var(--primary); }
        .folder-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #1c2128; }
        .folder-content { display: none; padding: 15px; background: #0d1117; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #30363d; }
        th { color: var(--accent); font-size: 0.9rem; }
        .btn-del { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        /* إمضاء المطور عمرو جابر */
        .dev-footer { position: fixed; bottom: 15px; left: 0; right: 0; text-align: center; font-size: 0.75rem; color: rgba(255, 255, 255, 0.2); letter-spacing: 2px; z-index: -1; pointer-events: none; transition: 0.5s; }
        body:hover .dev-footer { color: var(--accent); text-shadow: 0 0 8px var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>لوحة تحكم مستر الدولا 🎓</h1>
            <p>نظام الإدارة الذكي للطلاب</p>
        </div>

        <div class="class-manager">
            <input type="text" id="newClassName" placeholder="اسم المجموعة الجديدة (مثلاً: تالته اعدادي)">
            <button class="btn-create" onclick="createClass()">+ إنشاء مجموعة</button>
        </div>

        <div id="tabsContainer" class="tabs"></div>

        <div class="input-card">
            <h3>إضافة بيانات في: <span id="activeClassNameText" style="color:var(--accent)">عام</span></h3>
            <input type="text" id="sid" placeholder="كود الطالب">
            <input type="text" id="sname" placeholder="اسم الطالب">
            <input type="number" id="sgrade" placeholder="الدرجة">
            <input type="text" id="sexam_name" placeholder="اسم الامتحان / الحصة">
            <input type="number" id="spay" placeholder="المبلغ">
            <select id="spaid">
                <option value="✅">دفع ✅</option>
                <option value="❌">لم يدفع ❌</option>
            </select>
            <button class="btn-add" onclick="saveData()">إضافة البيانات للملف</button>
        </div>

        <div id="studentsList"></div>

        <div class="dev-footer">
            DEVELOPED BY: AMR GABER
        </div>
    </div>

    <script>
        let myClasses = JSON.parse(localStorage.getItem('myClasses')) || ["عام"];
        let currentClass = localStorage.getItem('lastClass') || myClasses[0];

        window.onload = () => updateUI();

        function createClass() {
            const name = document.getElementById('newClassName').value.trim();
            if(!name) return;
            if(!myClasses.includes(name)) myClasses.push(name);
            localStorage.setItem('myClasses', JSON.stringify(myClasses));
            document.getElementById('newClassName').value = "";
            switchClass(name);
        }

        function switchClass(className) {
            currentClass = className;
            localStorage.setItem('lastClass', className);
            updateUI();
        }

        function updateUI() {
            // تحديث التبويبات
            document.getElementById('tabsContainer').innerHTML = myClasses.map(c => `
                <div class="tab-btn ${currentClass === c ? 'active' : ''}" onclick="switchClass('${c}')">
                    ${c}
                </div>
            `).join('');
            
            document.getElementById('activeClassNameText').innerText = currentClass;
            renderAdmin();
        }

        function saveData() {
            const id = document.getElementById('sid').value.trim();
            const name = document.getElementById('sname').value.trim();
            if(!id || !name) return alert("الكود والاسم مطلوبين!");

            let students = JSON.parse(localStorage.getItem('students')) || {};
            
            // لو الطالب مش موجود، ننشئه ونربطه بالمجموعة الحالية
            if(!students[id]) {
                students[id] = { name: name, levelClass: currentClass, history: [] };
            }

            // إضافة الحصة للسجل
            students[id].history.push({
                date: new Date().toLocaleDateString('ar-EG'),
                grade: document.getElementById('sgrade').value || "0",
                examName: document.getElementById('sexam_name').value || "حصة",
                pay: document.getElementById('spay').value || "0",
                paidStatus: document.getElementById('spaid').value
            });

            localStorage.setItem('students', JSON.stringify(students));
            
            // مسح الخانات بعد الحفظ
            document.getElementById('sid').value = "";
            document.getElementById('sname').value = "";
            document.getElementById('sgrade').value = "";
            
            alert("تمت الإضافة بنجاح!");
            renderAdmin(); // إعادة الرسم فوراً
        }

        function renderAdmin() {
            const students = JSON.parse(localStorage.getItem('students')) || {};
            const container = document.getElementById('studentsList');
            container.innerHTML = '';
            
            let found = false;
            for(let id in students) {
                // فلترة الطلاب حسب المجموعة النشطة حالياً
                if(students[id].levelClass === currentClass) {
                    found = true;
                    let rows = students[id].history.map((h, i) => `
                        <tr>
                            <td>${h.date}</td>
                            <td>${h.examName}</td>
                            <td style="color:var(--accent)">${h.grade}</td>
                            <td>${h.pay} ج.م</td>
                            <td>${h.paidStatus}</td>
                            <td><button class="btn-del" onclick="deleteSession('${id}', ${i})">❌</button></td>
                        </tr>
                    `).reverse().join('');

                    container.innerHTML += `
                    <div class="student-folder">
                        <div class="folder-header" onclick="toggleFolder('folder-${id}')">
                            <span>📁 <b>${students[id].name}</b> (${id})</span>
                            <span style="background:var(--primary); padding:2px 8px; border-radius:10px; font-size:0.7rem;">
                                ${students[id].history.length} حصص
                            </span>
                        </div>
                        <div id="folder-${id}" class="folder-content">
                            <table>
                                <thead>
                                    <tr><th>التاريخ</th><th>الامتحان</th><th>الدرجة</th><th>المبلغ</th><th>الحالة</th><th>حذف</th></tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>`;
                }
            }
            if(!found) container.innerHTML = `<p style="text-align:center; opacity:0.5;">لا يوجد طلاب في هذه المجموعة بعد.</p>`;
        }

        function toggleFolder(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function deleteSession(id, index) {
            if(!confirm("حذف هذه الحصة؟")) return;
            let students = JSON.parse(localStorage.getItem('students'));
            students[id].history.splice(index, 1);
            localStorage.setItem('students', JSON.stringify(students));
            renderAdmin();
        }
    </script>
</body>
</html>
