<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المستر Dawla</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 30px; }
        .input-card { background: var(--card); padding: 25px; border-radius: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; border: 1px solid #334155; }
        input, select { padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; grid-column: 1 / -1; }
        .student-folder { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; border-right: 6px solid var(--primary); }
        .folder-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table th, td { padding: 12px; text-align: center; border-bottom: 1px solid #334155; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-right: 5px; }
        .btn-lock { background: #f59e0b; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>لوحة تحكم المستر Dawla 🎓</h1></div>
        
        <div class="input-card">
            <input type="text" id="sid" placeholder="كود الطالب">
            <input type="text" id="sname" placeholder="اسم الطالب">
            <input type="number" id="sgrade" placeholder="الدرجة">
            <input type="text" id="slevel" placeholder="المستوى">
            <input type="number" id="spay" placeholder="المبلغ المطلوب">
            <select id="spaid">
                <option value="✅">دفع صح ✅</option>
                <option value="❌">مدافعش غلط ❌</option>
            </select>
            <button class="btn-add" onclick="saveData()">إضافة الحصة ونشرها للطالب</button>
        </div>

        <div id="studentsList"></div>
    </div>

    <script>
        window.onload = renderAdmin;

        function saveData() {
            const id = document.getElementById('sid').value.trim();
            const name = document.getElementById('sname').value.trim();
            
            if(!id || !name) return alert("يا مستر لازم تدخل الكود والاسم!");

            let students = JSON.parse(localStorage.getItem('students')) || {};
            
            // تهيئة الطالب لو مش موجود
            if(!students[id]) {
                students[id] = { 
                    name: name, 
                    password: "", 
                    isLocked: false, 
                    history: [] 
                };
            }

            // إضافة الحصة
            const newSession = {
                date: new Date().toLocaleDateString('ar-EG'),
                grade: document.getElementById('sgrade').value || "0",
                level: document.getElementById('slevel').value || "-",
                pay: document.getElementById('spay').value || "0",
                paidStatus: document.getElementById('spaid').value
            };

            students[id].history.push(newSession);
            localStorage.setItem('students', JSON.stringify(students));
            
            renderAdmin();
            alert("تم إرسال البيانات لملف " + name);
        }

        function deleteSession(id, index) {
            let students = JSON.parse(localStorage.getItem('students'));
            students[id].history.splice(index, 1);
            localStorage.setItem('students', JSON.stringify(students));
            renderAdmin();
        }

        function deleteFile(id) {
            if(confirm("هل تريد مسح ملف الطالب بالكامل؟")) {
                let students = JSON.parse(localStorage.getItem('students'));
                delete students[id];
                localStorage.setItem('students', JSON.stringify(students));
                renderAdmin();
            }
        }

        function toggleLock(id) {
            let students = JSON.parse(localStorage.getItem('students'));
            students[id].isLocked = !students[id].isLocked;
            localStorage.setItem('students', JSON.stringify(students));
            renderAdmin();
        }

        function renderAdmin() {
            const students = JSON.parse(localStorage.getItem('students')) || {};
            const container = document.getElementById('studentsList');
            container.innerHTML = '';

            for(let id in students) {
                let rows = students[id].history.map((h, i) => `
                    <tr>
                        <td>${h.date}</td>
                        <td>${h.grade}</td>
                        <td>${h.pay} ج.م</td>
                        <td>${h.paidStatus}</td>
                        <td><button class="btn-del" onclick="deleteSession('${id}', ${i})">حذف</button></td>
                    </tr>
                `).join('');

                container.innerHTML += `
                <div class="student-folder">
                    <div class="folder-header">
                        <h3>📁 ${students[id].name} (كود: ${id}) ${students[id].isLocked ? '🔒' : ''}</h3>
                        <div>
                            <button class="btn-lock" onclick="toggleLock('${id}')">${students[id].isLocked ? 'فتح الملف' : 'قفل الملف'}</button>
                            <button class="btn-del" onclick="deleteFile('${id}')">حذف الملف</button>
                        </div>
                    </div>
                    <table class="history-table">
                        <thead><tr><th>التاريخ</th><th>الدرجة</th><th>المبلغ</th><th>الحالة</th><th>تحكم</th></tr></thead>
                        <tbody>${rows || '<tr><td colspan="5">لا يوجد حصص</td></tr>'}</tbody>
                    </table>
                </div>`;
            }
        }
    </script>
</body>
</html>
