<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم مستر الدولا 🎓</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #11141b; --text: #e6edf3; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: auto; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        
        .group-section { background: var(--card); border: 1px dashed var(--accent); padding: 15px; border-radius: 12px; display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .group-section input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; width: 250px; }
        .btn-create { background: #00d2ff; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { background: #2d1b69; border: 1px solid var(--primary); color: white; padding: 10px 25px; border-radius: 12px; cursor: pointer; position: relative; }
        .tab-btn.active { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .close-tab { margin-right: 8px; color: #ff4d4d; font-weight: bold; }

        .input-card { background: var(--card); border: 2px solid var(--primary); border-radius: 20px; padding: 25px; margin-bottom: 40px; }
        .input-card h3 { text-align: center; color: var(--accent); margin-bottom: 20px; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 10px; text-align: center; }
        .btn-save { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; margin-top: 20px; font-weight: bold; cursor: pointer; }

        .student-card { background: #161b22; border: 1px solid var(--primary); border-radius: 15px; margin-bottom: 20px; overflow: hidden; }
        .card-header { background: #1c2128; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .card-header b { color: var(--accent); }
        .badge { background: var(--primary); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { color: var(--accent); padding: 12px; border-bottom: 2px solid #30363d; }
        td { padding: 12px; border-bottom: 1px solid #30363d; }
        .btn-del-row { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
        .btn-del-all { background: #ff0000; color: white; border: none; padding: 8px 15px; border-radius: 6px; float: left; margin: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>لوحة تحكم مستر الدولا 🎓</h1>
        <p>نظام الإدارة الذكي للطلاب</p>
    </div>

    <div class="group-section">
        <input type="text" id="groupInput" placeholder="اسم المجموعة الجديدة">
        <button class="btn-create" onclick="addGroup()">+ إنشاء مجموعة</button>
    </div>

    <div id="tabsArea" class="tabs"></div>

    <div class="input-card">
        <h3>إضافة بيانات طالب في مجموعة: <span id="activeGroupTitle">...</span></h3>
        <div class="input-grid">
            <input type="text" id="s_id" placeholder="الكود">
            <input type="text" id="s_name" placeholder="اسم الطالب">
            <input type="text" id="s_exam" placeholder="الامتحان">
            <input type="number" id="s_grade" placeholder="الدرجة">
            <input type="number" id="s_pay" placeholder="المبلغ">
            <select id="s_paid">
                <option value="✅">دفع ✅</option>
                <option value="❌">لم يدفع ❌</option>
            </select>
        </div>
        <button class="btn-save" onclick="handleSave()">إضافة البيانات للملف</button>
    </div>

    <div id="studentsArea"></div>
</div>

<script>
    // تهيئة البيانات
    let myGroups = JSON.parse(localStorage.getItem('myGroups')) || ["عام"];
    let activeGroup = localStorage.getItem('activeGroup') || "عام";
    let allStudents = JSON.parse(localStorage.getItem('students')) || {};

    window.onload = () => refreshUI();

    function addGroup() {
        let val = document.getElementById('groupInput').value.trim();
        if(val && !myGroups.includes(val)) {
            myGroups.push(val);
            localStorage.setItem('myGroups', JSON.stringify(myGroups));
            document.getElementById('groupInput').value = "";
            switchGroup(val);
        }
    }

    function switchGroup(name) {
        activeGroup = name;
        localStorage.setItem('activeGroup', name);
        refreshUI();
    }

    function refreshUI() {
        document.getElementById('tabsArea').innerHTML = myGroups.map(g => `
            <div class="tab-btn ${g === activeGroup ? 'active' : ''}" onclick="switchGroup('${g}')">
                ${g} ${g !== 'عام' ? `<span class="close-tab" onclick="deleteGroup(event, '${g}')">×</span>` : ''}
            </div>
        `).join('');
        document.getElementById('activeGroupTitle').innerText = activeGroup;
        renderCards();
    }

    function handleSave() {
        // تأكد من أن الأسماء هنا تطابق الـ IDs في الـ HTML
        const id = document.getElementById('s_id').value.trim();
        const name = document.getElementById('s_name').value.trim();
        
        if(!id || !name) return alert("الرجاء إدخال الكود والاسم");

        if(!allStudents[id]) {
            allStudents[id] = { name: name, group: activeGroup, history: [] };
        }

        allStudents[id].history.push({
            date: new Date().toLocaleDateString('ar-EG'),
            exam: document.getElementById('s_exam').value || "حصة",
            grade: document.getElementById('s_grade').value || "0",
            pay: document.getElementById('s_pay').value || "0",
            status: document.getElementById('s_paid').value
        });

        localStorage.setItem('students', JSON.stringify(allStudents));
        alert("تم الحفظ بنجاح!");
        
        // تفريغ الخانات
        document.getElementById('s_id').value = "";
        document.getElementById('s_name').value = "";
        
        renderCards();
    }

    function renderCards() {
        const area = document.getElementById('studentsArea');
        area.innerHTML = "";
        
        for(let id in allStudents) {
            let s = allStudents[id];
            if(s.group === activeGroup) {
                let rows = s.history.map((h, index) => `
                    <tr>
                        <td>${h.date}</td>
                        <td>${h.exam}</td>
                        <td style="color:var(--accent)">${h.grade}</td>
                        <td>${h.pay} ج.م</td>
                        <td>${h.status}</td>
                        <td><button class="btn-del-row" onclick="deleteRow('${id}', ${index})">×</button></td>
                    </tr>
                `).reverse().join('');

                area.innerHTML += `
                    <div class="student-card">
                        <div class="card-header">
                            <div>📂 <b>${s.name} (${id})</b></div>
                            <span class="badge">${s.history.length} حصص</span>
                        </div>
                        <table>
                            <thead>
                                <tr><th>التاريخ</th><th>الامتحان</th><th>الدرجة</th><th>المبلغ</th><th>الحالة</th><th>حذف</th></tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                        <button class="btn-del-all" onclick="deleteStudent('${id}')">حذف الطالب بالكامل</button>
                    </div>
                `;
            }
        }
    }

    function deleteRow(id, idx) {
        if(confirm("حذف السجل؟")) {
            allStudents[id].history.splice(idx, 1);
            localStorage.setItem('students', JSON.stringify(allStudents));
            renderCards();
        }
    }

    function deleteStudent(id) {
        if(confirm("حذف الطالب نهائياً؟")) {
            delete allStudents[id];
            localStorage.setItem('students', JSON.stringify(allStudents));
            renderCards();
        }
    }

    function deleteGroup(e, name) {
        e.stopPropagation();
        if(confirm("حذف المجموعة بالكامل؟")) {
            myGroups = myGroups.filter(g => g !== name);
            localStorage.setItem('myGroups', JSON.stringify(myGroups));
            switchGroup('عام');
        }
    }
</script>

</body>
</html>
