<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم مستر الدولا 🎓</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #11141b; --text: #e6edf3; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; direction: rtl; }
        .container { max-width: 1100px; margin: auto; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .group-section { background: var(--card); border: 1px dashed var(--accent); padding: 15px; border-radius: 12px; display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { background: #2d1b69; border: 1px solid var(--primary); color: white; padding: 10px 25px; border-radius: 12px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .input-card { background: var(--card); border: 2px solid var(--primary); border-radius: 20px; padding: 25px; margin-bottom: 40px; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        input, select { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 10px; text-align: center; }
        .btn-save { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; margin-top: 20px; font-weight: bold; cursor: pointer; }
        .student-card { background: #161b22; border: 1px solid var(--primary); border-radius: 15px; margin-bottom: 20px; padding: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #30363d; text-align: center; }
        th { color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>لوحة تحكم مستر الدولا</h1></div>

    <div class="group-section">
        <input type="text" id="groupName" placeholder="اسم المجموعة">
        <button onclick="addClass()" style="background:#00d2ff; color:black; padding:10px; border-radius:8px; border:none; font-weight:bold;">+ إنشاء مجموعة</button>
    </div>

    <div id="tabsArea" class="tabs"></div>

    <div class="input-card">
        <h3 style="text-align:center;">إضافة بيانات طالب في: <span id="curGroupTxt" style="color:var(--accent)">عام</span></h3>
        <div class="input-grid">
            <input type="text" id="s_id" placeholder="الكود">
            <input type="text" id="s_name" placeholder="اسم الطالب">
            <input type="text" id="s_exam" placeholder="الامتحان">
            <input type="number" id="s_grade" placeholder="الدرجة">
            <input type="number" id="s_pay" placeholder="المبلغ">
            <select id="s_paid">
                <option value="✅">دفع ✅</option>
                <option value="❌">لم يدفع ❌</option>
            </select>
        </div>
        <button class="btn-save" onclick="saveToStorage()">إضافة البيانات الآن</button>
    </div>

    <div id="displayArea"></div>
</div>

<script>
    // 1. استرجاع البيانات
    let groups = JSON.parse(localStorage.getItem('groups')) || ["عام"];
    let currentTab = localStorage.getItem('currentTab') || "عام";
    let data = JSON.parse(localStorage.getItem('students')) || {};

    // 2. تشغيل عند الفتح
    window.onload = () => { renderTabs(); renderData(); };

    // 3. إضافة مجموعة
    function addClass() {
        let name = document.getElementById('groupName').value.trim();
        if(name && !groups.includes(name)) {
            groups.push(name);
            localStorage.setItem('groups', JSON.stringify(groups));
            document.getElementById('groupName').value = "";
            setTab(name);
        }
    }

    function setTab(t) {
        currentTab = t;
        localStorage.setItem('currentTab', t);
        renderTabs();
        renderData();
    }

    function renderTabs() {
        document.getElementById('tabsArea').innerHTML = groups.map(g => `
            <button class="tab-btn ${g === currentTab ? 'active' : ''}" onclick="setTab('${g}')">${g}</button>
        `).join('');
        document.getElementById('curGroupTxt').innerText = currentTab;
    }

    // 4. حفظ البيانات (الأهم)
    function saveToStorage() {
        const id = document.getElementById('s_id').value.trim();
        const name = document.getElementById('s_name').value.trim();

        if(!id || !name) return alert("دخل الكود والاسم!");

        // إنشاء الطالب لو مش موجود
        if(!data[id]) {
            data[id] = { name: name, group: currentTab, history: [] };
        }

        // إضافة السجل
        data[id].history.push({
            date: new Date().toLocaleDateString('ar-EG'),
            exam: document.getElementById('s_exam').value || "حصة",
            grade: document.getElementById('s_grade').value || "0",
            pay: document.getElementById('s_pay').value || "0",
            paid: document.getElementById('s_paid').value
        });

        localStorage.setItem('students', JSON.stringify(data));
        alert("تم الحفظ في مجموعة: " + currentTab);
        
        // تفريغ الخانات
        document.getElementById('s_id').value = "";
        document.getElementById('s_name').value = "";
        
        renderData(); // تحديث العرض فوراً
    }

    // 5. عرض البيانات
    function renderData() {
        const area = document.getElementById('displayArea');
        area.innerHTML = "";
        let count = 0;

        for(let id in data) {
            if(data[id].group === currentTab) {
                count++;
                let rows = data[id].history.map((h, i) => `
                    <tr>
                        <td>${h.date}</td><td>${h.exam}</td><td>${h.grade}</td><td>${h.pay}</td><td>${h.paid}</td>
                        <td><button onclick="deleteRecord('${id}', ${i})" style="background:red; color:white; border:none; cursor:pointer;">X</button></td>
                    </tr>
                `).reverse().join('');

                area.innerHTML += `
                    <div class="student-card">
                        <b>📂 ${data[id].name} (${id})</b>
                        <table>
                            <thead><tr><th>التاريخ</th><th>الامتحان</th><th>درجة</th><th>مبلغ</th><th>حالة</th><th>حذف</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                        <button onclick="delStudent('${id}')" style="background:red; color:white; border:none; padding:5px; margin-top:10px; border-radius:5px; cursor:pointer;">حذف الطالب</button>
                    </div>`;
            }
        }
        if(count === 0) area.innerHTML = "<p style='text-align:center;'>لا يوجد طلاب في هذه المجموعة</p>";
    }

    function deleteRecord(id, i) {
        data[id].history.splice(i, 1);
        localStorage.setItem('students', JSON.stringify(data));
        renderData();
    }

    function delStudent(id) {
        if(confirm("تحذف الطالب؟")) {
            delete data[id];
            localStorage.setItem('students', JSON.stringify(data));
            renderData();
        }
    }
</script>
</body>
</html>
