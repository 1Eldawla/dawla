<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم مستر الدولا 🎓</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #11141b; --text: #e6edf3; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: auto; }
        
        /* زر الإصلاح السريع */
        .fix-btn { background: #ff4d4d; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }

        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .group-section { background: var(--card); border: 1px dashed var(--accent); padding: 15px; border-radius: 12px; display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .group-section input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; width: 250px; }
        .btn-create { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { background: #2d1b69; border: 1px solid var(--primary); color: white; padding: 10px 25px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); box-shadow: 0 0 15px var(--primary); }

        .input-card { background: var(--card); border: 2px solid var(--primary); border-radius: 20px; padding: 25px; margin-bottom: 40px; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        input, select { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 10px; text-align: center; }
        .btn-save { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; margin-top: 20px; font-weight: bold; cursor: pointer; }

        .student-card { background: #161b22; border: 1px solid var(--primary); border-radius: 15px; margin-bottom: 20px; padding: 15px; border-right: 5px solid var(--accent); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { color: var(--accent); padding: 10px; border-bottom: 2px solid #30363d; }
        td { padding: 10px; border-bottom: 1px solid #30363d; text-align: center; }
        .btn-del { background: #ff4d4d; border: none; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <button class="fix-btn" onclick="clearEverything()">⚠️ تصفير الذاكرة وإصلاح العطل (اضغط هنا لو الجدول مش ظاهر)</button>

    <div class="header">
        <h1>لوحة تحكم مستر الدولا 🎓</h1>
        <p>برمجة: عمرو جابر</p>
    </div>

    <div class="group-section">
        <input type="text" id="groupInp" placeholder="اسم المجموعة الجديدة">
        <button class="btn-create" onclick="addNewGroup()">+ إنشاء مجموعة</button>
    </div>

    <div id="tabsDiv" class="tabs"></div>

    <div class="input-card">
        <h3 style="text-align:center;">إضافة بيانات طالب في: <span id="activeTitle" style="color:var(--accent)">...</span></h3>
        <div class="input-grid">
            <input type="text" id="s_id" placeholder="الكود">
            <input type="text" id="s_name" placeholder="اسم الطالب">
            <input type="text" id="s_exam" placeholder="الامتحان">
            <input type="number" id="s_grade" placeholder="الدرجة">
            <input type="number" id="s_pay" placeholder="المبلغ">
            <select id="s_paid">
                <option value="✅">دفع ✅</option>
                <option value="❌">لم يدفع ❌</option>
            </select>
        </div>
        <button class="btn-save" onclick="saveData()">إضافة البيانات للملف</button>
    </div>

    <div id="displayArea"></div>
</div>

<script>
    // تهيئة المتغيرات
    let groups = JSON.parse(localStorage.getItem('groups')) || ["عام"];
    let currentTab = localStorage.getItem('currentTab') || "عام";
    let students = JSON.parse(localStorage.getItem('students')) || {};

    window.onload = () => refresh();

    // وظيفة الإصلاح
    function clearEverything() {
        if(confirm("سيتم مسح كل الطلاب والمجموعات لضبط المصنع وإصلاح العطل، موافق؟")) {
            localStorage.clear();
            location.reload();
        }
    }

    function addNewGroup() {
        let val = document.getElementById('groupInp').value.trim();
        if(val && !groups.includes(val)) {
            groups.push(val);
            localStorage.setItem('groups', JSON.stringify(groups));
            document.getElementById('groupInp').value = "";
            changeTab(val);
        }
    }

    function changeTab(t) {
        currentTab = t;
        localStorage.setItem('currentTab', t);
        refresh();
    }

    function refresh() {
        // تحديث التبويبات
        document.getElementById('tabsDiv').innerHTML = groups.map(g => `
            <button class="tab-btn ${g === currentTab ? 'active' : ''}" onclick="changeTab('${g}')">${g}</button>
        `).join('');
        document.getElementById('activeTitle').innerText = currentTab;
        renderData();
    }

    function saveData() {
        const id = document.getElementById('s_id').value.trim();
        const name = document.getElementById('s_name').value.trim();

        if(!id || !name) return alert("دخل الكود والاسم!");

        // ربط الطالب بالمجموعة الحالية (Current Tab)
        if(!students[id]) {
            students[id] = { name: name, group: currentTab, history: [] };
        }

        students[id].history.push({
            date: new Date().toLocaleDateString('ar-EG'),
            exam: document.getElementById('s_exam').value || "حصة",
            grade: document.getElementById('s_grade').value || "0",
            pay: document.getElementById('s_pay').value || "0",
            paid: document.getElementById('s_paid').value
        });

        localStorage.setItem('students', JSON.stringify(students));
        alert("تم الحفظ بنجاح في: " + currentTab);
        
        document.getElementById('s_id').value = "";
        document.getElementById('s_name').value = "";
        renderData();
    }

    function renderData() {
        const area = document.getElementById('displayArea');
        area.innerHTML = "";
        let found = false;

        for(let id in students) {
            // شرط العرض: الطالب لازم يكون في نفس المجموعة النشطة
            if(students[id].group === currentTab) {
                found = true;
                let rows = students[id].history.map((h, i) => `
                    <tr>
                        <td>${h.date}</td><td>${h.exam}</td><td>${h.grade}</td><td>${h.pay}</td><td>${h.paid}</td>
                        <td><button class="btn-del" onclick="deleteRecord('${id}', ${i})">❌</button></td>
                    </tr>
                `).reverse().join('');

                area.innerHTML += `
                    <div class="student-card">
                        <b>📂 ${students[id].name} (كود: ${id})</b>
                        <table>
                            <thead><tr><th>التاريخ</th><th>الامتحان</th><th>درجة</th><th>مبلغ</th><th>حالة</th><th>حذف</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                        <button onclick="delStudent('${id}')" style="background:red; color:white; border:none; margin-top:10px; cursor:pointer; padding:5px; border-radius:5px;">حذف الطالب بالكامل</button>
                    </div>`;
            }
        }
        if(!found) area.innerHTML = "<p style='text-align:center; opacity:0.5;'>لا يوجد طلاب في مجموعة " + currentTab + "</p>";
    }

    function deleteRecord(id, i) {
        students[id].history.splice(i, 1);
        localStorage.setItem('students', JSON.stringify(students));
        renderData();
    }

    function delStudent(id) {
        if(confirm("حذف؟")) {
            delete students[id];
            localStorage.setItem('students', JSON.stringify(students));
            renderData();
        }
    }
</script>
</body>
</html>
