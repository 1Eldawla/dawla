<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | مستر الدولا</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .input-card { background: var(--card); padding: 20px; border-radius: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; grid-column: 1/-1; font-weight: bold; }
        .student-folder { background: var(--card); border-radius: 10px; margin-bottom: 10px; border-right: 5px solid var(--primary); padding: 15px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .history-table th, .history-table td { padding: 10px; border-bottom: 1px solid #334155; text-align: center; font-size: 0.9rem; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>لوحة تحكم مستر الدولا 🎓</h1>
        <button onclick="localStorage.removeItem('adminKey'); location.href='index.html'" style="background:rgba(0,0,0,0.3); color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">تسجيل خروج</button>
    </div>

    <div class="input-card">
        <input type="text" id="sid" placeholder="الكود">
        <input type="text" id="sname" placeholder="الاسم">
        <input type="text" id="sexam" placeholder="الامتحان">
        <input type="number" id="sgrade" placeholder="الدرجة">
        <select id="slevel">
            <option value="ممتاز ⭐⭐⭐">ممتاز ⭐⭐⭐</option>
            <option value="جيد جداً ⭐⭐">جيد جداً ⭐⭐</option>
            <option value="جيد ⭐">جيد ⭐</option>
            <option value="ضعيف ⚠️">ضعيف ⚠️</option>
        </select>
        <input type="number" id="spay" placeholder="المبلغ">
        <select id="spaid">
            <option value="✅">دفع ✅</option>
            <option value="❌">لم يدفع ❌</option>
        </select>
        <button class="btn-add" onclick="saveData()">إضافة البيانات الآن</button>
    </div>

    <div id="studentsList"></div>

    <script>
        // السماح بالدخول إذا وجد المفتاح
        if (!localStorage.getItem('adminKey')) {
            // تنبيه بسيط بدل الطرد الفوري لتجربة أسهل
            console.log("برجاء الدخول من الصفحة الرئيسية أولاً");
        }

        let students = JSON.parse(localStorage.getItem('students')) || {};

        function saveData() {
            const id = document.getElementById('sid').value.trim();
            const name = document.getElementById('sname').value.trim();
            if(!id || !name) return alert("دخل الاسم والكود!");

            if(!students[id]) students[id] = { name: name, history: [] };
            
            students[id].history.push({
                date: new Date().toLocaleDateString('ar-EG'),
                examName: document.getElementById('sexam').value || "حصة",
                grade: document.getElementById('sgrade').value || "0",
                level: document.getElementById('slevel').value,
                pay: document.getElementById('spay').value || "0",
                paidStatus: document.getElementById('spaid').value
            });

            localStorage.setItem('students', JSON.stringify(students));
            alert("تم الحفظ!");
            renderAdmin();
        }

        function renderAdmin() {
            const container = document.getElementById('studentsList');
            container.innerHTML = '';
            for (let id in students) {
                let rows = students[id].history.map((h, i) => `
                    <tr>
                        <td>${h.date}</td>
                        <td>${h.examName}</td>
                        <td style="color:var(--accent)">${h.grade}</td>
                        <td style="color:#ffcc00">${h.level || '---'}</td>
                        <td>${h.pay} ج.م</td>
                        <td><button class="btn-del" onclick="deleteSession('${id}', ${i})">❌</button></td>
                    </tr>`).reverse().join('');

                container.innerHTML += `
                <div class="student-folder">
                    <h3>📁 ${students[id].name} (${id})</h3>
                    <table class="history-table">
                        <thead><tr><th>التاريخ</th><th>الامتحان</th><th>الدرجة</th><th>المستوى</th><th>المبلغ</th><th>حذف</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                    <button class="btn-del" style="margin-top:10px" onclick="deleteStudent('${id}')">حذف الطالب نهائياً</button>
                </div>`;
            }
        }

        function deleteSession(id, index) {
            students[id].history.splice(index, 1);
            localStorage.setItem('students', JSON.stringify(students));
            renderAdmin();
        }

        function deleteStudent(id) {
            if(confirm("حذف الطالب؟")) {
                delete students[id];
                localStorage.setItem('students', JSON.stringify(students));
                renderAdmin();
            }
        }

        renderAdmin();
    </script>
</body>
</html>
