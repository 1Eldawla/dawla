<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم مستر الدولا | برمجة عمرو جابر</title>
    <style>
        :root { --primary: #7c3aed; --bg: #0b0e14; --card: #161b22; --text: #e6edf3; --accent: #00d2ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        .header { background: linear-gradient(135deg, #7c3aed, #4f46e5); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .tab-btn { padding: 10px 20px; background: var(--card); border: 1px solid #30363d; color: white; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); border-color: var(--accent); box-shadow: 0 0 10px rgba(124, 58, 237, 0.5); }
        .input-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--primary); margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .input-card h3 { grid-column: 1/-1; margin-top: 0; color: var(--accent); text-align: center; }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; font-size: 14px; }
        .btn-add { background: var(--primary); cursor: pointer; grid-column: 1/-1; font-weight: bold; border: none; }
        .student-folder { background: var(--card); border: 1px solid #30363d; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        .folder-header { padding: 15px; background: #1c2128; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid var(--primary); }
        .folder-content { display: none; padding: 15px; background: #0d1117; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #30363d; text-align: center; font-size: 13px; }
        th { background: #1c2128; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>لوحة تحكم مستر الدولا 🎓</h1>
        <p>برمجة: عمرو جابر</p>
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
        <input type="text" id="newClassName" placeholder="اسم مجموعة جديدة">
        <button onclick="addClass()" style="background: var(--accent); color: black; font-weight: bold;">+ إنشاء مجموعة</button>
    </div>

    <div id="tabsList" class="tabs"></div>

    <div class="input-card">
        <h3>إضافة طالب في مجموعة: <span id="activeGroupName" style="color:var(--primary)">عام</span></h3>
        <input type="text" id="sid" placeholder="الكود">
        <input type="text" id="sname" placeholder="اسم الطالب">
        <input type="text" id="sexam" placeholder="الامتحان">
        <input type="number" id="sgrade" placeholder="الدرجة">
        <input type="number" id="spay" placeholder="المبلغ">
        <select id="spaid">
            <option value="✅">دفع ✅</option>
            <option value="❌">لم يدفع ❌</option>
        </select>
        <button class="btn-add" onclick="addNewData()">إضافة البيانات الآن</button>
    </div>

    <div id="displayArea"></div>
</div>

<script>
    let groups = JSON.parse(localStorage.getItem('groups')) || ["عام"];
    let currentGroup = localStorage.getItem('currentGroup') || "عام";
    let students = JSON.parse(localStorage.getItem('students')) || {};

    window.onload = () => { renderTabs(); renderStudents(); };

    function addClass() {
        let name = document.getElementById('newClassName').value.trim();
        if (name && !groups.includes(name)) {
            groups.push(name);
            localStorage.setItem('groups', JSON.stringify(groups));
            renderTabs();
        }
    }

    function renderTabs() {
        document.getElementById('tabsList').innerHTML = groups.map(g => `
            <button class="tab-btn ${g === currentGroup ? 'active' : ''}" onclick="selectGroup('${g}')">${g}</button>
        `).join('');
        document.getElementById('activeGroupName').innerText = currentGroup;
    }

    function selectGroup(name) {
        currentGroup = name;
        localStorage.setItem('currentGroup', name);
        renderTabs();
        renderStudents();
    }

    function addNewData() {
        const id = document.getElementById('sid').value.trim();
        const name = document.getElementById('sname').value.trim();
        if (!id || !name) return alert("دخل الكود والاسم");

        if (!students[id]) {
            students[id] = { name: name, group: currentGroup, history: [] };
        }

        students[id].history.push({
            date: new Date().toLocaleDateString('ar-EG'),
            exam: document.getElementById('sexam').value || "حصة",
            grade: document.getElementById('sgrade').value || "0",
            pay: document.getElementById('spay').value || "0",
            paid: document.getElementById('spaid').value
        });

        localStorage.setItem('students', JSON.stringify(students));
        alert("تم الحفظ بنجاح!");
        
        // دي أهم خطوة: بننادي على الدالة اللي بترسم البيانات فوراً
        renderStudents(); 
    }

    function renderStudents() {
        const area = document.getElementById('displayArea');
        area.innerHTML = "";
        for (let id in students) {
            if (students[id].group === currentGroup) {
                let rows = students[id].history.map(h => `
                    <tr>
                        <td>${h.date}</td><td>${h.exam}</td><td>${h.grade}</td><td>${h.pay}</td><td>${h.paid}</td>
                    </tr>
                `).reverse().join('');

                area.innerHTML += `
                    <div class="student-folder">
                        <div class="folder-header" onclick="toggle('${id}')">
                            <span>📂 <b>${students[id].name}</b> (كود: ${id})</span>
                            <span>${students[id].history.length} حصص ▼</span>
                        </div>
                        <div id="content-${id}" class="folder-content">
                            <table>
                                <thead><tr><th>التاريخ</th><th>الامتحان</th><th>الدرجة</th><th>المبلغ</th><th>الحالة</th></tr></thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>`;
            }
        }
    }

    function toggle(id) {
        let el = document.getElementById('content-' + id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }
</script>
</body>
</html>
